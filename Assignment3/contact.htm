    <h1>Contact Us</h1>

    <p>Have questions about the Coding Club? Feel free to contact us.</p>

    <h2>Get in Touch</h2>

    <p>Email: codingclub@example.com</p>
    <p>Location: Computer Lab, Invertis University</p>

    <h2>Send Us a Message</h2>

    <form action="#" method="post">
        <p>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
        </p>

        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </p>

        <p>
            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="4" cols="30" required></textarea>
        </p>

        <button type="submit">Send Message</button>
    </form>

</body>
