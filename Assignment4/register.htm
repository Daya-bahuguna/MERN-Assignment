    <h1>Coding Club Registration</h1>

    <p>Fill in the form below to register for the Coding Club.</p>

    <form action="#" method="post">
        <p>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name"
                   placeholder="Your name" required>
        </p>

        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </p>

        <p>
            <label for="pass">Password:</label>
            <input type="password" id="pass" name="pass" required>
        </p>

        <p>
            <label for="dob">Date of birth:</label>
            <input type="date" id="dob" name="dob">
        </p>

        <p>
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone">
        </p>

        <p>
            Gender:
            <input type="radio" name="gender" id="m" value="Male">
            <label for="m">Male</label>

            <input type="radio" name="gender" id="f" value="Female">
            <label for="f">Female</label>
        </p>

        <p>
            Interests:
            <input type="checkbox" id="web" name="interests" value="Web">
            <label for="web">Web</label>

            <input type="checkbox" id="dsa" name="interests" value="DSA">
            <label for="dsa">DSA</label>
        </p>

        <p>
            <label for="branch">Branch:</label>
            <select id="branch" name="branch">
                <option>BCA</option>
                <option>B.Tech</option>
            </select>
        </p>

        <p>
            <label for="msg">Why do you want to join?</label><br>
            <textarea id="msg" name="message" rows="3" cols="30"></textarea>
        </p>

        <button type="submit">Register</button>
    </form>

</body>
</html>
