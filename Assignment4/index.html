
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Coding Club</title>

    <link rel="icon" href="./favicon1_io/favicon.ico?v=2" type="image/x-icon">

    <!-- Week 5.3 - Google Font is imported in style.css -->

    <!-- Week 5.5 - Colour choices:
    I chose light lavender for the background to create a calm, clean appearance.
    Dark navy text makes the content easy to read.
    Purple and teal highlight headings and buttons, giving the page a consistent look.
    -->

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <a href="index.html">Home</a> |
        <a href="about.htm">About</a> |
        <a href="register.htm">Register</a> |
        <a href="contact.htm">Contact</a>
    </nav>

    <header id="hero">
        <h1>Coding Club</h1>
        <p>Learn, practise, and build your coding skills.</p>
    </header>

    <section class="card">
        <h2 id="events">Upcoming Events</h2>

        <table>
            <caption>Club Events</caption>

            <thead>
                <tr>
                    <th>Event</th>
                    <th>Date</th>
                    <th>Venue</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Web Development Workshop</td>
                    <td>16 Nov</td>
                    <td>Computer Lab</td>
                </tr>

                <tr>
                    <td>Code Sprint</td>
                    <td>25 Nov</td>
                    <td>Seminar Hall</td>
                </tr>
            </tbody>

            <tfoot>
                <tr>
                    <td colspan="3" style="text-align: center;">
                        Total events: 2
                    </td>
                </tr>
            </tfoot>
        </table>
    </section>

    <section class="card">
        <h2 id="register">Register</h2>

        <form action="#" method="post">
            <p>
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name"
                       placeholder="Your name" required>
            </p>

            <p>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="pass">Password:</label><br>
                <input type="password" id="pass" name="pass" required>
            </p>

            <p>
                <label for="dob">Date of birth:</label><br>
                <input type="date" id="dob" name="dob">
            </p>

            <p>
                <label for="phone">Phone:</label><br>
                <input type="tel" id="phone" name="phone">
            </p>

            <p>
                Gender:<br>
                <input type="radio" name="gender" id="m" value="Male">
                <label for="m">Male</label>

                <input type="radio" name="gender" id="f" value="Female">
                <label for="f">Female</label>
            </p>

            <p>
                Interests:<br>
                <input type="checkbox" id="web" name="interests" value="Web">
                <label for="web">Web</label>

                <input type="checkbox" id="dsa" name="interests" value="DSA">
                <label for="dsa">DSA</label>
            </p>

            <p>
                <label for="branch">Branch:</label><br>
                <select id="branch" name="branch">
                    <option>BCA</option>
                    <option>B.Tech</option>
                </select>
            </p>

            <p>
                <label for="msg">Why do you want to join?</label><br>
                <textarea id="msg" name="msg" rows="3" cols="30"></textarea>
            </p>

            <button type="submit">Register</button>
        </form>
    </section>
</body>
</html>
