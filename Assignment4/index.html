
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Coding Club</title>

    <link rel="icon" href="./favicon1_io/favicon.ico?v=2" type="image/x-icon">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Week 5.4 - CSS Variables */

        :root {
            --color-background: #f4f6ff;
            --color-text: #303653;
            --color-navigation: #28345c;
            --color-primary: #5145cd;
            --color-secondary: #087f8c;
            --color-heading-background: #e3e7ff;
            --color-card: #ffffff;
            --color-border: #d9deef;
            --color-input-border: #c5cbe0;

            --spacing-small: 10px;
            --spacing-medium: 20px;
            --spacing-large: 25px;

            --radius-small: 6px;
            --radius-medium: 10px;
            --radius-large: 12px;
        }

        /* Basic styling */

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--color-background);
            color: var(--color-text);
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            padding: var(--spacing-large);
            line-height: 1.6;
        }

        nav {
            background-color: var(--color-navigation);
            padding: 16px;
            border-radius: var(--radius-medium);
            margin-bottom: var(--spacing-large);
        }

        nav a {
            color: var(--color-card);
            text-decoration: none;
            font-weight: 600;
            margin: 8px;
        }

        h1 {
            background-color: var(--color-heading-background);
            color: var(--color-primary);
            text-align: center;
            padding: var(--spacing-large);
            border-radius: var(--radius-large);
            letter-spacing: 1px;
            font-size: 36px;
        }

        h2 {
            color: var(--color-secondary);
            margin-top: 28px;
            font-size: 24px;
        }

        p {
            font-size: 17px;
        }

        /* ID selector */

        #hero {
            background-color: var(--color-heading-background);
            padding: var(--spacing-large);
            border-radius: var(--radius-large);
        }

        /* Class selector */

        .card {
            background-color: var(--color-card);
            padding: var(--spacing-medium);
            border-radius: var(--radius-large);
            margin: var(--spacing-medium) 0;
        }

        /* Table styling */

        table {
            width: 100%;
            background-color: var(--color-card);
            border-collapse: collapse;
            margin: 15px 0;
        }

        caption {
            color: var(--color-primary);
            font-weight: 600;
            padding: 12px;
        }

        th {
            background-color: var(--color-primary);
            color: var(--color-card);
            padding: 12px;
        }

        td {
            padding: 12px;
            border: 1px solid var(--color-border);
        }

        /* Form styling */

        form {
            background-color: var(--color-card);
            padding: 22px;
            border-radius: var(--radius-large);
            margin-top: 15px;
        }

        input,
        select,
        textarea {
            padding: 9px;
            border: 1px solid var(--color-input-border);
            border-radius: var(--radius-small);
            font-family: inherit;
        }

        button {
            background-color: var(--color-secondary);
            color: var(--color-card);
            padding: 11px 22px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-family: inherit;
        }
    </style>
</head>

<body>
    <nav>
        <a href="index.html">Home</a> |
        <a href="about.htm">About</a> |
        <a href="register.htm">Register</a> |
        <a href="contact.htm">Contact</a>
    </nav>

    <header id="hero">
        <h1>Coding Club</h1>
        <p>Learn, practise, and build your coding skills.</p>
    </header>

    <section class="card">
        <h2 id="events">Upcoming Events</h2>

        <table>
            <caption>Club Events</caption>

            <thead>
                <tr>
                    <th>Event</th>
                    <th>Date</th>
                    <th>Venue</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Web Development Workshop</td>
                    <td>16 Nov</td>
                    <td>Computer Lab</td>
                </tr>

                <tr>
                    <td>Code Sprint</td>
                    <td>25 Nov</td>
                    <td>Seminar Hall</td>
                </tr>
            </tbody>

            <tfoot>
                <tr>
                    <td colspan="3" style="text-align: center;">
                        Total events: 2
                    </td>
                </tr>
            </tfoot>
        </table>
    </section>

    <section class="card">
        <h2 id="register">Register</h2>

        <form action="#" method="post">
            <p>
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name"
                       placeholder="Your name" required>
            </p>

            <p>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="pass">Password:</label><br>
                <input type="password" id="pass" name="pass" required>
            </p>

            <p>
                <label for="dob">Date of birth:</label><br>
                <input type="date" id="dob" name="dob">
            </p>

            <p>
                <label for="phone">Phone:</label><br>
                <input type="tel" id="phone" name="phone">
            </p>

            <p>
                Gender:<br>
                <input type="radio" name="gender" id="m" value="Male">
                <label for="m">Male</label>

                <input type="radio" name="gender" id="f" value="Female">
                <label for="f">Female</label>
            </p>

            <p>
                Interests:<br>
                <input type="checkbox" id="web" name="interests" value="Web">
                <label for="web">Web</label>

                <input type="checkbox" id="dsa" name="interests" value="DSA">
                <label for="dsa">DSA</label>
            </p>

            <p>
                <label for="branch">Branch:</label><br>
                <select id="branch" name="branch">
                    <option>BCA</option>
                    <option>B.Tech</option>
                </select>
            </p>

            <p>
                <label for="msg">Why do you want to join?</label><br>
                <textarea id="msg" name="msg" rows="3" cols="30"></textarea>
            </p>

            <button type="submit">Register</button>
        </form>
    </section>
</body>
</html>
