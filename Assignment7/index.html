
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef4fc;
            color: #263d5c;
        }

        .layout {
            display: grid;
            grid-template-columns: 170px 1fr;
            grid-template-areas:
                "head head"
                "side main"
                "foot foot";
            gap: 12px;
            min-height: 100vh;
            padding: 12px;
        }

        header {
            grid-area: head;
            background: #263d5c;
            color: white;
            padding: 18px;
            border-radius: 8px;
        }

        aside {
            grid-area: side;
            background: #d7e8fc;
            padding: 18px;
            border-radius: 8px;
        }

        aside ul {
            margin: 12px 0 0 20px;
        }

        aside li {
            margin-bottom: 10px;
        }

        main {
            grid-area: main;
            min-width: 0;
        }

        main h2 {
            margin-bottom: 12px;
        }

        .welcome {
            margin-bottom: 16px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 16px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #d5e5f5;
        }

        .icon {
            font-size: 28px;
        }

        footer {
            grid-area: foot;
            background: #263d5c;
            color: white;
            padding: 14px;
            text-align: center;
            border-radius: 8px;
        }

        @media (max-width: 600px) {
            .layout {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "head"
                    "side"
                    "main"
                    "foot";
            }
        }
    </style>
</head>
<body>

    <div class="layout">

        <header>
            <h2>My Dashboard</h2>
        </header>

        <aside>
            <h3>Menu</h3>
            <ul>
                <li>Home</li>
                <li>Reports</li>
                <li>Settings</li>
            </ul>
        </aside>

        <main>
            <h2>Dashboard Overview</h2>
            <p class="welcome">Welcome to your dashboard!</p>

            <div class="gallery">
                <div class="item">
                    <span class="icon">&#128100;</span>
                    <div><b>120</b><br>Users</div>
                </div>

                <div class="item">
                    <span class="icon">&#128176;</span>
                    <div><b>Rs 45k</b><br>Sales</div>
                </div>

                <div class="item">
                    <span class="icon">&#128230;</span>
                    <div><b>36</b><br>Orders</div>
                </div>

                <div class="item">
                    <span class="icon">&#11088;</span>
                    <div><b>4.8</b><br>Rating</div>
                </div>

                <div class="item">
                    <span class="icon">&#128172;</span>
                    <div><b>18</b><br>Messages</div>
                </div>

                <div class="item">
                    <span class="icon">&#9989;</span>
                    <div><b>92%</b><br>Done</div>
                </div>
            </div>
        </main>

        <footer>
            Made with CSS Grid
        </footer>

    </div>

</body>
</html>
